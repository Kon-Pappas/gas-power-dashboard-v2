name: Daily Energy Data Update

# Ενημέρωση ΜΟΝΟ από το εξωτερικό cron-job.org (07:06 και 13:00, ώρα Ελλάδος, ζώνη Europe/Athens),
# που καλεί αυτό το workflow μέσω workflow_dispatch. Σκόπιμα ΔΕΝ υπάρχει schedule:
# το native schedule του GitHub καθυστερεί απρόβλεπτα και, μετά την αλλαγή ώρας, θα ξεκινούσε 06:00 Ελλάδας,
# πριν δημοσιευτεί το SCADA (~06:05). Βλ. docs/DECISIONS.md (D07).
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start Date (π.χ. 2026-09-01)'
        required: false
        type: string
      end_date:
        description: 'End Date (π.χ. 2026-09-23)'
        required: false
        type: string

permissions:
  contents: write

# Ένα run τη φορά: ένα manual backfill που συμπίπτει με τα 07:06 / 13:00 περιμένει στην ουρά
# αντί να τρέξει παράλληλα και να αποτύχει το push.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Extraction Script
        env:
          TZ: "Europe/Athens"
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          OILPRICE_API_KEY: ${{ secrets.OILPRICE_API_KEY }}
        run: python update_data.py

      # always(): αν μία ημέρα αποτύχει, το script γράφει ό,τι πέτυχε και βγαίνει με κωδικό 1 (το run γίνεται κόκκινο, D29)·
      # τα σωστά δεδομένα πρέπει να φτάσουν στο repo παρ' όλα αυτά.
      - name: Commit and Push Changes
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historical.json data/meta.json
          if [ -f data/scada_hourly.json ]; then git add data/scada_hourly.json; fi

          if git diff --staged --quiet; then
            echo "Δεν βρέθηκαν νέα δεδομένα (ή δεν υπάρχει αλλαγή). Παράβλεψη commit."
          else
            git commit -m "data: Auto-update market data 🤖 [skip ci]"
            git push
          fi
