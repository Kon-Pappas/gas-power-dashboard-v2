name: Daily Energy Data Update

on:
  schedule:
    # Τρέχει κάθε μέρα στις 04:00 UTC (07:00 ώρα Ελλάδος)
    - cron: '0 4 * * *'
  workflow_dispatch: # Σου επιτρέπει να το τρέχεις χειροκίνητα με ένα κουμπί από το GitHub

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Κρατάει cache τις βιβλιοθήκες για να τρέχει πιο γρήγορα

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Fetcher
        env:
          TZ: "Europe/Athens"
        run: python update_data.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/historical.json
          
          # Κάνει commit μόνο αν το Python script βρήκε και έγραψε νέα δεδομένα
          if ! git diff-index --quiet HEAD; then
            git commit -m "data: daily market data update"
            git push
          else
            echo "No new data to commit."
          fi
